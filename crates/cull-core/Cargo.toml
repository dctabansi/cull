[package]
name = "cull-core"
version = "0.1.0"
edition = "2024"
description = "Native Rust tabular parsing, schema inference, and linting core for Cull"
license = "MIT"

[lib]
name = "cull_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module"] }
csv = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.clippy]
all = "warn"
unwrap_used = "warn"
