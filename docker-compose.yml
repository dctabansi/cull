services:
  postgres:
    image: postgres:18-alpine
    container_name: cull-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cull_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cull_local_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cull_workbench}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cull_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cull_user} -d ${POSTGRES_DB:-cull_workbench}"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: cull-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cull_valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cull_pgdata:
  cull_valkeydata:
